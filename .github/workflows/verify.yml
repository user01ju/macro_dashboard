name: 資料交叉驗證

# Tier B（FRED / TWSE 交叉源）每日一次。這個 workflow 紅了不影響資料更新與部署，
# 只代表「TradingView 餵的數字跟官方源對不起來」需要人看一眼。
# 順便把 Tier A 對 gh-pages 上「實際部署中」的狀態再跑一次（零外部呼叫、零成本），
# 這樣連「macro_update 很久沒跑成功、線上頁面已凍住」也會被 page-generated-freshness 抓到。
on:
  schedule:
    # 台北 23:30／UTC 15:30：晚於當天 UTC 14:17 那輪資料更新，
    # 也晚於美國 CPI/NFP（12:30–13:30 UTC）與 TWSE 月營收公告。
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      force_fail:
        description: '注入一條必定 FAIL 的檢查，用來驗證告警管道會不會寄信'
        type: boolean
        default: false
  repository_dispatch:
    # 讓外部 cron（或手動打 API）也能觸發，並可帶 client_payload.force_fail=1。
    # 這是刻意的：GitHub 的失敗通知行為在 schedule / workflow_dispatch /
    # repository_dispatch 三種事件下不見得一樣，要能分別驗證。
    types: [verify]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: 還原線上狀態（從 gh-pages）
        run: |
          set -o pipefail
          mkdir -p output

          # verify 不部署，所以還原失敗不會毀資料 —— 它毀的是「驗證本身」：
          # output/ 空的話所有檢查一律 SKIP，workflow 綠燈收工、什麼都沒驗。
          # 舊寫法（2>/dev/null || true 再看 show-ref）把 fetch 失敗誤判成
          # 「分支尚未建立」，正好落進這個假性成功。所以先問遠端分支到底存不存在：
          # 真的沒有 → 警告後照走（首次部署前的合理狀態）；存在卻 fetch 不到 → 紅掉。
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "::warning::gh-pages 尚未建立，驗證將全數 SKIP"
            exit 0
          fi

          for i in 1 2 3; do
            if git fetch --force --depth=1 origin gh-pages:refs/remotes/origin/gh-pages; then
              break
            fi
            echo "gh-pages fetch 第 $i 次失敗，10 秒後重試"
            sleep 10
          done

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "::error::gh-pages 分支存在但 fetch 三次都失敗 — 中止，避免驗證空跑成假性 PASS"
            exit 1
          fi

          git archive origin/gh-pages | tar -x -C output/
          echo "狀態已還原"

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行驗證
        env:
          VERIFY_FORCE_FAIL: ${{ (github.event.inputs.force_fail == 'true' || github.event.client_payload.force_fail == '1') && '1' || '' }}
        run: |
          set +e
          python verify.py --tier all
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::驗證有 FAIL（詳見上方 [FAIL] 行）"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::驗證有 WARN（不算失敗，詳見上方 [WARN] 行）"
          fi
