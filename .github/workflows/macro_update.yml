name: 總經數據更新

on:
  schedule:
    # 每 3 小時；主要公布時段：美 CPI/NFP 12:30/13:30 UTC、ISM 14/15 UTC、
    # FOMC 18/19 UTC、台灣出口/台積電營收 06-08 UTC
    # 注意：公開 repo 的 schedule 常大幅延遲，必要時搭外部 cron 走 repository_dispatch
    - cron: '17 */3 * * *'
  repository_dispatch:
    types: [update]
  workflow_dispatch:
    inputs:
      force_fail:
        description: '注入一條必定 FAIL 的檢查，驗證告警管道並確認 FAIL 真的擋得住部署'
        type: boolean
        default: false

# 三個觸發源（排程 / repository_dispatch / 手動）可能撞車：兩個 run 從同一個
# gh-pages commit 還原 output/，後完成的會用較舊的 base 覆蓋部署，把已寫入的
# analyzed_at 蓋掉 → 下一輪重打 Claude API 燒錢，且完全無聲。
# cancel-in-progress 必須是 false：update.py 在 save_json 之間被砍會留下半寫狀態。
concurrency:
  group: macro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: 還原歷史狀態（從 gh-pages）
        run: |
          mkdir -p output
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git archive origin/gh-pages | tar -x -C output/ || true
            echo "狀態已還原"
          else
            echo "gh-pages 尚未建立，從頭部署"
          fi

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行更新
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update.py

      - name: Tier A 資料驗證（FAIL 擋部署）
        env:
          VERIFY_FORCE_FAIL: ${{ (github.event.inputs.force_fail == 'true' || github.event.client_payload.force_fail == '1') && '1' || '' }}
        run: |
          set +e
          python verify.py --tier a
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Tier A 驗證有 FAIL，中止部署（詳見上方 [FAIL] 行）"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::Tier A 有 WARN，不擋部署（詳見上方 [WARN] 行）"
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          commit_message: 'chore: update macro dashboard'
