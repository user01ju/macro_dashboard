name: 總經數據更新

on:
  schedule:
    # 每 3 小時；主要公布時段：美 CPI/NFP 12:30/13:30 UTC、ISM 14/15 UTC、
    # FOMC 18/19 UTC、台灣出口/台積電營收 06-08 UTC
    # 注意：公開 repo 的 schedule 常大幅延遲，必要時搭外部 cron 走 repository_dispatch
    - cron: '17 */3 * * *'
  repository_dispatch:
    types: [update]
  workflow_dispatch:
    inputs:
      force_fail:
        description: '注入一條必定 FAIL 的檢查，驗證告警管道並確認 FAIL 真的擋得住部署'
        type: boolean
        default: false
      skip_verify:
        description: '略過資料驗證直接部署（確定是假警報、門檻還沒空修時的逃生門）'
        type: boolean
        default: false

# 三個觸發源（排程 / repository_dispatch / 手動）可能撞車：兩個 run 從同一個
# gh-pages commit 還原 output/，後完成的會用較舊的 base 覆蓋部署，把已寫入的
# analyzed_at 蓋掉 → 下一輪重打 Claude API 燒錢，且完全無聲。
# cancel-in-progress 必須是 false：update.py 在 save_json 之間被砍會留下半寫狀態。
concurrency:
  group: macro-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: 還原歷史狀態（從 gh-pages）
        run: |
          set -o pipefail
          mkdir -p output

          # gh-pages 同時是成品 host 和狀態 store（events.json 內含全部 AI 判讀），
          # 所以「還原失敗」不是退化而是資料毀損：整包 output/ 會被只有今天的內容
          # 覆蓋，線上判讀全消失，下一輪還會把它們全部重打一次（燒 API 錢、無聲）。
          # 舊寫法（2>/dev/null || true 再看 show-ref）會把 fetch 失敗誤判成
          # 「gh-pages 尚未建立」而走冷啟動 —— twse_website 2026-08-03 就是這樣被
          # 自己的 CI 抹掉 282 天快取。所以：先問遠端分支存不存在，存在就一定要
          # 還原成功，失敗寧可讓 job 紅掉也不部署。
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages 尚未建立，從頭部署"
            exit 0
          fi

          for i in 1 2 3; do
            if git fetch --force --depth=1 origin gh-pages:refs/remotes/origin/gh-pages; then
              break
            fi
            echo "gh-pages fetch 第 $i 次失敗，10 秒後重試"
            sleep 10
          done

          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "::error::gh-pages 分支存在但 fetch 三次都失敗 — 中止，避免用空狀態覆蓋線上"
            exit 1
          fi

          git archive origin/gh-pages | tar -x -C output/
          echo "狀態已還原"

      - name: 設定 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行更新
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python update.py

      - name: Tier A 資料驗證（FAIL 擋部署）
        if: >-
          github.event.inputs.skip_verify != 'true'
          && github.event.client_payload.skip_verify != '1'
        env:
          VERIFY_FORCE_FAIL: ${{ (github.event.inputs.force_fail == 'true' || github.event.client_payload.force_fail == '1') && '1' || '' }}
        run: |
          set +e
          python verify.py --tier a
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Tier A 驗證有 FAIL，中止部署（詳見上方 [FAIL] 行）"
            exit 1
          fi
          if [ "$code" -eq 2 ]; then
            echo "::warning::Tier A 有 WARN，不擋部署（詳見上方 [WARN] 行）"
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          keep_files: false
          commit_message: 'chore: update macro dashboard'
